[project]
name = "ai-soc-backend"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "openai>=3.49.0",
    "langgraph>=1.2.20",
    "sse-starlette>=3.7.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
